version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialapp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Override DB/Redis to use container names if local
      DB_URI: mongodb://mongo:27017/SocialApp
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./views:/app/views:ro
    networks:
      - socialapp-net

  mongo:
    image: mongo:7
    container_name: socialapp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: SocialApp
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialapp-net

  redis:
    image: redis:7-alpine
    container_name: socialapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialapp-net

volumes:
  mongo-data:
  redis-data:

networks:
  socialapp-net:
    driver: bridge
